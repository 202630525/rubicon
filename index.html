<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed the Fish 🐟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-card">
    <header>
      <h1>🐟 Feed The Fish</h1>
      <div class="stats-board">
        <span>Score: <strong id="score">0</strong></span>
        <span>Hunger: <strong id="hunger">100%</strong></span>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="aquarium" width="600" height="400"></canvas>
    </div>

    <p class="instructions">Click anywhere inside the aquarium to drop food pellets!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
